<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Arm the scroll-reveal CSS before first paint. Kept in the shell so the
      // prerendered HTML stays readable when this script — or the app bundle —
      // never runs.
      document.documentElement.classList.add('js');
    </script>
    <noscript>
      <style>
        :root.js [data-reveal] { opacity: 1; transform: none; }
      </style>
    </noscript>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231b1815'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23f4f1ea' font-family='Georgia' font-style='italic'>H</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-title-->
    <!--app-description-->
    <!--app-canonical-->
    <!--app-robots-->
    <!--app-jsonld-->
    <link rel="alternate" type="application/rss+xml" title="Blog — Munawirul Hadi" href="/blog.xml" />
    <!-- Kept for the raw shell and the dev server: prerender drops this tag and
         injects the route's own title, so no emitted page ships two title elements. -->
    <title data-shell>Munawirul Hadi — Senior Frontend Engineer (React, TypeScript)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- #root is prerendered at build time by scripts/prerender.mjs -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
